name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      # also checks formatting: gofumpt and goimports (.golangci.yml)
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
      - run: go test -race ./...
      - name: third-party notices are current
        run: scripts/notices.sh && git diff --exit-code THIRD_PARTY_NOTICES.md
