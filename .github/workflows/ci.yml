name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      # also checks formatting: gofumpt and goimports (.golangci.yml)
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
      - run: go test -race -coverpkg=./... -coverprofile=/tmp/cover.out ./...
      # tests in one package count for the others they drive
      - name: coverage stays at 94.5% or more
        run: go tool cover -func=/tmp/cover.out | awk '/^total:/ { sub("%", "", $3); print "coverage " $3 "%"; if ($3 < 94.5) exit 1 }'
      - name: third-party notices are current
        run: scripts/notices.sh && git diff --exit-code THIRD_PARTY_NOTICES.md
