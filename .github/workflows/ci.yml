name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # vet, golangci-lint (also gofumpt and goimports, .golangci.yml) and the
  # tests; tests in one package count for the others they drive
  go:
    uses: jwarykowski/workflows/.github/workflows/go.yml@v1
    with:
      test-flags: -race
      coverage-min: "94.5"

  notices:
    runs-on: ubuntu-latest
    container:
      image: localhost/forgejo-job:1
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: third-party notices are current
        run: scripts/notices.sh && git diff --exit-code THIRD_PARTY_NOTICES.md
